name: build-and-push-pds-ghcr
# Alpha-only: `main` images are built by docker-images.yaml.
on:
  push:
    branches:
      - permissioned-data-alpha

jobs:
  pds-container-ghcr:
    if: github.repository == 'bluesky-social/atproto'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      # Temporary until fixed runner images roll out:
      # https://github.com/actions/runner-images/issues/15018
      - name: Update Ubuntu CA certificates
        run: |
          sudo apt-get update -qq
          sudo apt-get install --only-upgrade --no-install-recommends -y ca-certificates

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4
        with:
          # The runner is discarded at the end of the job anyway
          cleanup: false

      - name: Log into registry ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=sha,enable=true,priority=100,prefix=pds:,suffix=,format=long
            type=raw,value=pds-spaces-alpha
          labels: |
            org.opencontainers.image.licenses=MIT OR Apache-2.0

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: pds
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pds
          cache-to: type=gha,scope=pds,mode=max,ignore-error=true,ghtoken=${{ secrets.GITHUB_TOKEN }}
