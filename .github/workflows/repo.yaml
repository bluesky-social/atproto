name: Repository CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref }}'
  cancel-in-progress: true

jobs:
  changeset:
    name: Changeset
    runs-on: ubuntu-latest
    # The dependabot-changeset.yml workflow will trigger a new commit after
    # Dependabot updates, which will re-trigger this workflow. Other jobs below
    # depend on this job, and will be skipped too. If Dependabot updates non NPM
    # dependencies (Dockerfile, GitHub Actions), this workflow should not be
    # affected (build/verify/test are not using the docker images) and can be
    # skipped. Note that in case, dependabot-changeset.yml will not trigger a
    # new commit, so this workflow will not be re-triggered. This is expected.
    if: >
      github.event.pull_request.draft == false &&
      github.event.sender.login != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed for git diff against base branch
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: '.nvmrc'
      - run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
      - run: pnpm changeset status --since=origin/${{ github.base_ref }}

  build:
    name: Build
    runs-on: ubuntu-latest
    # Ensure a changeset is present before we spend time building and testing.
    needs: changeset
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: '.nvmrc'
      - run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      # Each package resolves its own lexicons.json into ./lexicons during
      # `prebuild` (via `lex install --ci`). Canonical com.atproto.*/tools.ozone.*
      # schemas are symlinked from the repo root (instant) and at:// network
      # copies are committed, but app.bsky.*/chat.bsky.* are fetched from the
      # bluesky-social/bsky GitHub repo — the only part that costs a network
      # round-trip on a clean build. Cache those fetched trees keyed on the
      # lexicon manifests (each pins its documents' CIDs) plus the canonical
      # source, so an unchanged set restores from cache and `lex install --ci`
      # verifies it against the locked CIDs without re-fetching.
      - uses: actions/cache@v6
        id: lexicons-cache
        with:
          path: |
            packages/*/lexicons/app/bsky
            packages/*/lexicons/chat/bsky
          key: lexicons-${{ hashFiles('packages/*/lexicons.json', 'packages/*/*/lexicons.json', 'packages/*/lexicons-overrides/**', 'lexicons/**/*.json') }}

      - run: pnpm build

      - uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          retention-days: 2
          path: |
            packages/*/dist
            packages/*/*/dist
            packages/*/src/proto
            packages/*/src/lexicons
            packages/lex/*/src/lexicons
            packages/oauth/*/src/lexicons
            packages/oauth/*/src/locales/*/messages.ts
            packages/api/src/client
            packages/api/src/moderation/const/labels.ts

  test:
    name: Test
    needs: build
    runs-on: ubuntu-22.04
    # Puppeteer does not work in recent Ubuntu versions without a workaround due
    # to sandboxing issues. Using "ubuntu-latest" results in the following
    # error:
    #
    # No usable sandbox! If you are running on Ubuntu 23.10+ or another Linux
    # distro that has disabled unprivileged user namespaces with AppArmor, see
    # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md.
    # Otherwise see
    # https://chromium.googlesource.com/chromium/src/+/main/docs/linux/suid_sandbox_development.md
    # for more information on developing with the (older) SUID sandbox. If you
    # want to live dangerously and need an immediate workaround, you can try
    # using --no-sandbox.
    strategy:
      fail-fast: false
      matrix:
        shard: [1/8, 2/8, 3/8, 4/8, 5/8, 6/8, 7/8, 8/8]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: '22.x'
      - run: echo "CURRENT_MONTH=$(date +'%Y-%m')" >> $GITHUB_ENV
      - uses: actions/cache@v6
        name: Cache Puppeteer browser binaries
        with:
          path: ~/.cache/puppeteer
          key: ${{ env.CURRENT_MONTH }}-${{ runner.os }}-${{ runner.arch }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: packages
      - run: pnpm test:withFlags --maxWorkers=1 --shard=${{ matrix.shard }} --passWithNoTests

  verify:
    name: Verify
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: '.nvmrc'
      - run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
      - uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: packages
      - run: pnpm verify
