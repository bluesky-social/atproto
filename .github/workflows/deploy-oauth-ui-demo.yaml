name: deploy-oauth-ui-demo
on:
  # @NOTE The push trigger is what makes this usable. `workflow_dispatch` only
  # registers a workflow if the file exists on the *default* branch, and this
  # one deliberately lives on the redesign branch only — dispatching it against
  # the branch 404s. A push event runs the workflow from the pushed ref itself,
  # so no commit on `main` is needed.
  push:
    branches:
      - oauth-provider-redesign
    paths:
      - 'packages/oauth/oauth-provider-ui/**'
      - '.github/workflows/deploy-oauth-ui-demo.yaml'
  workflow_dispatch:

# Scratch tooling for the fork: publishes the oauth-provider-ui mock harness —
# the same four pages `pnpm dev:ui` serves, running against src/mock-api.ts —
# to Cloudflare Pages so the redesign can be clicked through without a PDS.
# Not intended for upstream.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN  - an account API token with the "Cloudflare Pages:
#                           Edit" permission. NOT an R2 access key; those are
#                           S3 credentials for object storage and cannot deploy
#                           Pages.
#   CLOUDFLARE_ACCOUNT_ID - the account ID (same value as R2_ACCOUNT_ID).

env:
  PAGES_PROJECT: atproto-oauth-ui-demo

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version-file: '.nvmrc'

      - run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      # The demo build only needs this package and its workspace deps.
      - run: pnpm --filter '@atproto/oauth-provider-ui...' build

      - run: pnpm --filter '@atproto/oauth-provider-ui' build:demo

      # @NOTE Deliberately not cloudflare/wrangler-action: it installs wrangler
      # with `pnpm add wrangler`, which pnpm refuses at a workspace root without
      # `-w` (ERR_PNPM_ADDING_TO_ROOT). Running npx from outside the workspace
      # also avoids the repo's `devEngines: pnpm` constraint, which makes npx
      # fail with EBADDEVENGINES anywhere inside it.
      - name: Deploy to Cloudflare Pages
        working-directory: ${{ runner.temp }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4 pages deploy
          "$GITHUB_WORKSPACE/packages/oauth/oauth-provider-ui/dist-demo"
          --project-name=${{ env.PAGES_PROJECT }}
          --branch=${{ github.ref_name }}
          --commit-dirty=true
