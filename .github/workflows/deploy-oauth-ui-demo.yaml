name: deploy-oauth-ui-demo
on:
  workflow_dispatch:

# Scratch tooling for the fork: publishes the oauth-provider-ui mock harness —
# the same four pages `pnpm dev:ui` serves, running against src/mock-api.ts —
# to Cloudflare Pages so the redesign can be clicked through without a PDS.
# Not intended for upstream.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN  - an account API token with the "Cloudflare Pages:
#                           Edit" permission. NOT an R2 access key; those are
#                           S3 credentials for object storage and cannot deploy
#                           Pages.
#   CLOUDFLARE_ACCOUNT_ID - the account ID (same value as R2_ACCOUNT_ID).

env:
  PAGES_PROJECT: atproto-oauth-ui-demo

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version-file: '.nvmrc'

      - run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      # The demo build only needs this package and its workspace deps.
      - run: pnpm --filter '@atproto/oauth-provider-ui...' build

      - run: pnpm --filter '@atproto/oauth-provider-ui' build:demo

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy packages/oauth/oauth-provider-ui/dist-demo
            --project-name=${{ env.PAGES_PROJECT }}
            --branch=${{ github.ref_name }}
