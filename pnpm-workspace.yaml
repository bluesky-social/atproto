packages:
  - 'services/*'
  - 'packages/*'
  - 'packages/lex/*'
  - 'packages/oauth/*'
  - 'packages/internal/*'

allowBuilds:
  '@bufbuild/buf': true
  '@swc/core': true
  better-sqlite3: true
  dd-trace: true
  esbuild: true
  protobufjs: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
  '@datadog/native-appsec': false
  '@datadog/native-iast-taint-tracking': false
  '@datadog/native-metrics': false
  '@datadog/pprof': false
  core-js: false
  rolldown: true

overrides:
  # Force express 4's vulnerable transitive cookie to a patched version. Do not
  # apply repo-wide: @atproto/oauth-provider directly depends on cookie 2.x.
  # TODO: remove this override once express is upgraded to 5.x (which already
  # depends on a patched cookie) or dropped entirely (see #5341).
  express>cookie: ^0.7.2
  opentelemetry-plugin-better-sqlite3>@opentelemetry/core: ^1.30.0
