packages:
  - 'services/*'
  - 'packages/*'
  - 'packages/lex/*'
  - 'packages/oauth/*'
  - 'packages/internal/*'

allowBuilds:
  '@bufbuild/buf': true
  '@swc/core': true
  better-sqlite3: true
  dd-trace: true
  esbuild: true
  protobufjs: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
  '@datadog/native-appsec': false
  '@datadog/native-iast-taint-tracking': false
  '@datadog/native-metrics': false
  '@datadog/pprof': false
  core-js: false
  rolldown: true
  '@parcel/watcher': true

minimumReleaseAgeExclude:
  - '@puppeteer/browsers@3.2.6'
  - puppeteer-core@25.16.0
  - puppeteer@25.16.0

overrides:
  cookie: ^0.7.2
  opentelemetry-plugin-better-sqlite3>@opentelemetry/core: ^1.30.0
  # Share the SDK's import-in-the-middle copy, without which ESM imports of
  # better-sqlite3 are not instrumented
  opentelemetry-plugin-better-sqlite3>@opentelemetry/instrumentation: ^0.300.0
  # https://github.com/advisories/GHSA-fjxv-7rqg-78g4
  'form-data@<2.5.4': '>=2.5.4'
  'form-data@>=3.0.0 <3.0.4': '>=3.0.4'
  'form-data@>=4.0.0 <4.0.4': '>=4.0.4'
  # https://github.com/advisories/GHSA-m7jm-9gc2-mpf2
  'fast-xml-parser@>=5.0.0 <5.3.5': '>=5.3.5'
  'fast-xml-parser@>=4.1.3 <4.5.4': '>=4.5.4'
  # https://github.com/advisories/GHSA-xq3m-2v4x-88gg
  'protobufjs@<7.5.5': '>=7.5.5'
  'protobufjs@>=8.0.0 <8.0.1': '>=8.0.1'
  'body-parser@<1.20.9': '^1.20.9'
  'body-parser@>=2.0.0 <2.4.0': '^2.4.0'
